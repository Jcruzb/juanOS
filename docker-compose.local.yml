services:
  api:
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:5173
      TRUST_PROXY: "1"
      AUTH_SEED_FILE: /run/secrets/juanos-auth-seed.json
    networks: [private, egress, local]
    volumes:
      - ./apps/api/seeds/auth.local.json:/run/secrets/juanos-auth-seed.json:ro

  web:
    networks: [private, local]
    volumes:
      - ./infra/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  local:
